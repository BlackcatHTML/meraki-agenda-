<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Meraki</title>
<meta name="description" content="Operação diária: tarefas, produção da semana e clientes.">
<meta name="robots" content="noindex">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1C0B12">
<meta name="color-scheme" content="dark">

<!-- iOS: standalone, sem barra do Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meraki">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.6 4 8.7 9.6 9.6C16 12 12.9 15.1 12 20.7 11.1 15.1 8 12 2.4 11.1 8 10.2 11.1 7.1 12 1.5z"/></svg>
      <span class="brand-name">Meraki</span>
    </div>
    <div class="topbar-date" id="topbarDate"></div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Navegação principal">
  <a class="tab" href="#/hoje" data-tab="hoje">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l6 3"/><circle cx="12" cy="12" r="9"/></svg>
    <span>Hoje</span>
  </a>
  <a class="tab" href="#/tarefas" data-tab="tarefas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M3 7l0 0"/></svg>
    <span>Tarefas</span>
  </a>
  <a class="tab" href="#/producao" data-tab="producao">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg>
    <span>Produção</span>
  </a>
  <a class="tab" href="#/clientes" data-tab="clientes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 8.2A3 3 0 0119 11"/><path d="M17 14.4c2.4.5 4 2.2 4 4.6"/></svg>
    <span>Clientes</span>
  </a>
  <a class="tab" href="#/links" data-tab="links">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a4 4 0 006 .5l2.5-2.5a4 4 0 00-5.7-5.7L11.5 6.6"/><path d="M14 11a4 4 0 00-6-.5L5.5 13a4 4 0 005.7 5.7l1.3-1.3"/></svg>
    <span>Links</span>
  </a>
  <a class="tab" href="#/notas" data-tab="notas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/></svg>
    <span>Notas</span>
  </a>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" type="button" data-close-sheet aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="./js/config.js"></script>
<script src="./js/store.js"></script>
<script src="./js/push.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
